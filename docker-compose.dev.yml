version: "3.9"

services:
  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dggash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dggash_dev}
      POSTGRES_DB: ${POSTGRES_DB:-dggash}

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dggash-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@dggash.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - dggash-network
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    ports:
      - "6379:6379"

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: dggash-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - dggash-network
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: dggash-api-dev
    ports:
      - "3001:3001"
      - "9229:9229"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/package.json:/app/package.json
      - ./apps/api/tsconfig.json:/app/tsconfig.json
      - api-node-modules:/app/node_modules
    env_file:
      - .env
    command: npx nodemon --watch src --exec ts-node -r tsconfig-paths/register src/index.ts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dggash-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: dggash-web-dev
    ports:
      - "3000:3000"
      - "6006:6006"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/app:/app/app
      - ./apps/web/public:/app/public
      - ./apps/web/package.json:/app/package.json
      - ./apps/web/next.config.js:/app/next.config.js
      - ./apps/web/tsconfig.json:/app/tsconfig.json
      - web-node-modules:/app/node_modules
      - web-next:/app/.next
    env_file:
      - .env
    environment:
      WATCHPACK_POLLING: "true"
    depends_on:
      api:
        condition: service_started
    networks:
      - dggash-network

  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - api

networks:
  dggash-network:
    driver: bridge

volumes:
  pgadmin-data:
  api-node-modules:
  web-node-modules:
  web-next:
