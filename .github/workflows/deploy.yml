name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SERVER_HOST }} ecdsa-sha2-nistp256 ${{ secrets.DEPLOY_SERVER_FINGERPRINT }}" >> ~/.ssh/known_hosts

      - name: Build and push Docker images
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ vars.REGISTRY_URL }} -u ${{ vars.REGISTRY_USER }} --password-stdin

          docker build -t ${{ vars.REGISTRY_URL }}/AWIK NET-api:${{ github.sha }} -f apps/api/Dockerfile --target production apps/api
          docker build -t ${{ vars.REGISTRY_URL }}/AWIK NET-web:${{ github.sha }} -f apps/web/Dockerfile --target runner apps/web

          docker push ${{ vars.REGISTRY_URL }}/AWIK NET-api:${{ github.sha }}
          docker push ${{ vars.REGISTRY_URL }}/AWIK NET-web:${{ github.sha }}

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SERVER_USER }}
          SSH_KEY: ~/.ssh/deploy_key
          DEPLOY_TAG: ${{ github.sha }}
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
        run: |
          ssh -i $SSH_KEY $SSH_USER@$SSH_HOST << 'ENDSSH'
            cd /opt/AWIK NET

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Export deployment tag
            export DEPLOY_TAG="${{ github.sha }}"
            export REGISTRY_URL="${{ vars.REGISTRY_URL }}"

            # Build and deploy
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            # Run migrations
            docker compose exec -T api npx prisma migrate deploy

            # Health check
            sleep 15
            curl -f http://localhost:3001/health || exit 1
            curl -f http://localhost:3000/ || exit 1

            echo "Deployment successful!"
          ENDSSH

      - name: Verify deployment
        run: |
          sleep 30
          curl -f "${{ vars.DEPLOY_URL }}/health" || echo "Health check failed"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Rolling back..."
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_SERVER_USER }}@${{ secrets.DEPLOY_SERVER_HOST }} << 'ENDSSH'
            cd /opt/AWIK NET
            git log --oneline -5
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down
            # Restore previous version
            git reset --hard HEAD~1
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
          ENDSSH
